name: KiCad R2 verify

# The checked-in project folder is the input; no ZIP is required.
# Trigger on source changes, not on this input-adapter setup commit.
on:
  push:
    branches:
      - verify/kicad-r2
    paths:
      - DDI_Phase2_2_R2_12CH/**

permissions:
  contents: read

concurrency:
  group: kicad-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
      KICAD8_SYMBOL_DIR: /usr/share/kicad/symbols
      KICAD8_FOOTPRINT_DIR: /usr/share/kicad/footprints
    steps:
      - name: Check out this exact verification commit
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record the source commit and require the project folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          printf '%s\n' "$GITHUB_SHA" > reports/commit-sha.txt
          printf '%s\n' "$GITHUB_REF" > reports/branch-ref.txt
          sha256sum verify_r2.py verify_r2_directory.py .github/workflows/kicad-verify.yml > reports/checker-sha256.txt
          python3 -c 'from pathlib import Path; import json; from verify_r2_directory import inventory; m = inventory(Path("DDI_Phase2_2_R2_12CH")); Path("reports/input_manifest.json").write_text(json.dumps(m, indent=2) + "\n", encoding="utf-8"); print("Input files:", len(m))' 2>&1 | tee reports/input-check.log

      - name: Install the R1-compatible KiCad 8.0.9 baseline
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee reports/install.log) 2>&1
          sudo apt-get -o Acquire::Retries=0 update
          sudo apt-get -o Acquire::Retries=0 install -y --no-install-recommends software-properties-common xvfb xauth
          sudo add-apt-repository --yes --no-update ppa:kicad/kicad-8.0-releases
          sudo apt-get -o Acquire::Retries=0 update
          sudo apt-get -o Acquire::Retries=0 install -y --no-install-recommends \
            kicad=8.0.9-0~ubuntu24.04.1 \
            kicad-library-symbols=8.0.9~ubuntu24.04.1 \
            kicad-library-footprints=8.0.9~ubuntu24.04.1 \
            kicad-library-templates=8.0.9~ubuntu24.04.1
          kicad-cli version | tee reports/kicad-version.txt
          dpkg-query -W -f='${Package}\t${Version}\n' > reports/installed-packages.txt
          mkdir -p "$HOME/.config/kicad/8.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/8.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/8.0/fp-lib-table"

      - name: Verify the R2 project directory with fresh netlist and ERC
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python3 verify_r2_directory.py \
            --project DDI_Phase2_2_R2_12CH \
            --expected-kicad 8.0.9 \
            --out reports 2>&1 | tee reports/verification.log

      - name: Save evidence, including failure logs
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: kicad-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
